# Alembic configuration for the DBWhisper *application* database (never a target database).
# The URL is injected at runtime from POSTGRES_CONNECTION_STRING / PROJECT_DB_CONNECTION_STRING
# by db/migrations/env.py; the value below is only a placeholder for offline `alembic` invocations.
[alembic]
script_location = db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///./dbwhisper-local.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
