# Prometheus scrape configuration for the optional `observability` compose profile.
#
# Two scrape jobs and nothing else. The application exposes /metrics from a dedicated registry
# (app/observability/metrics.py); the collector exposes its own health so a silent trace pipeline
# is visible rather than mysterious.
#
# The 15s interval is chosen against the histogram buckets in metrics.py: quantiles are computed
# with histogram_quantile over `rate(..._bucket[5m])`, which needs several samples per window.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: dbwhisper

scrape_configs:
  - job_name: dbwhisper-api
    metrics_path: /metrics
    # Hostnames are compose service names. Change these for any other deployment topology.
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: api
    # /metrics is unauthenticated by design and must stay on an internal network. It exposes no
    # customer data - every label value comes from a closed or bounded set - but it does reveal
    # traffic shape, so do not publish it.

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          component: collector
