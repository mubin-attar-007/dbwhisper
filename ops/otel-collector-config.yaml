# OpenTelemetry Collector for the optional `observability` compose profile.
#
# The application already refuses to emit anything outside the allowlist in
# app/observability/attributes.py. This file repeats part of that refusal *outside* the process,
# for two reasons a reviewer should be able to see at a glance:
#
#   1. Third-party instrumentation is not bound by our allowlist. `opentelemetry-instrumentation-
#      fastapi` and any library instrumentation added later emit their own semantic-convention
#      attributes, and `db.statement` is literally "the SQL text". The `attributes/scrub`
#      processor deletes those keys before anything is exported.
#   2. Defence in depth is the point. If the in-process scrubber is ever bypassed by a bug, the
#      collector is a second place the mistake has to get past.
#
# The collector is optional. Nothing here is required for DBWhisper to run.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Bound the collector's own memory before it starts dropping data unpredictably.
  memory_limiter:
    check_interval: 2s
    limit_mib: 384
    spike_limit_mib: 96

  # Keys that may carry customer data or credentials. `delete` is unconditional: we would rather
  # lose a debugging aid than export a DSN or a row.
  attributes/scrub:
    actions:
      - key: db.statement
        action: delete
      - key: db.query.text
        action: delete
      - key: db.connection_string
        action: delete
      - key: db.user
        action: delete
      - key: url.query
        action: delete
      - key: url.full
        action: delete
      - key: http.target
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: user.email
        action: delete
      - key: enduser.id
        action: delete
      - key: exception.message
        action: delete
      - key: exception.stacktrace
        action: delete

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Uncomment while debugging the pipeline; noisy by design, so it is not in the pipeline below.
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      # Prometheus scrapes the collector's own metrics from here (see ops/prometheus.yml).
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [otlp/jaeger]
